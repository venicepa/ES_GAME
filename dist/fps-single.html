  setWeapon(label, cur, mag, reloading) {
    this.el.wep.textContent = label;
    this.el.mag.textContent = cur;
    this.el.res.textContent = `/${mag}`;
    this.el.ammo.classList.toggle('empty', cur === 0);
    this.el.reload.textContent = reloading ? 'RELOADING' : '';
  }

  setHP(hp) {
    this.el.hp.textContent = hp;
    this.el.hpFill.style.width = `${Math.max(0, Math.min(100, hp))}%`;
    this.el.hpWrap.classList.toggle('hurt', hp <= 35);
    this.el.lowhp.classList.toggle('on', hp > 0 && hp <= 30);
  }

  setTeam(team) {
    const key = BADGES[team] ? team : 'ct';
    this.el.badge.innerHTML = BADGES[key];
    this.el.root.style.setProperty('--team', TEAM_COLOR[key]);
  }

  setSpread(v) {
    this.el.cross.style.setProperty('--gap', `${(3 + v * 26).toFixed(1)}px`);
  }

  setScoped(on) {
    this.el.scope.classList.toggle('on', !!on);
    this.el.cross.style.display = on ? 'none' : '';
  }

  setScore(ct, t) {
    this.el.ct.textContent = ct;
    this.el.t.textContent = t;
  }

  setTime(sec) {
    const s = Math.max(0, Math.ceil(sec));
    this.el.time.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    this.el.time.classList.toggle('low', s <= 15);
  }

  killfeed(left, right, weapon) {
    const d = document.createElement('div');
    d.innerHTML = `<em>${left}</em><span>${weapon}</span>${right}`;
    this.el.feed.appendChild(d);
    setTimeout(() => d.remove(), 4200);
    while (this.el.feed.childElementCount > 5) this.el.feed.firstChild.remove();
  }

  hitmarker(kill) {
    const el = this.el.hit;
    el.classList.remove('on');
    el.classList.toggle('kill', !!kill);
    void el.offsetWidth;
    el.classList.add('on');
  }

  flashDamage() {
    const el = this.el.dmg;
    el.classList.add('on');
    setTimeout(() => el.classList.remove('on'), 55);
  }

  message(text, ms = 1500) {
    this.el.msg.textContent = text;
    this.el.msg.classList.add('on');
    clearTimeout(this.msgTimer);
    this.msgTimer = setTimeout(() => this.el.msg.classList.remove('on'), ms);
  }

  clearFeed() {
    this.el.feed.innerHTML = '';
  }

  showTitle({ onNew, onFind }) {
    this.el.btnNew.onclick = onNew;
    this.el.btnFind.onclick = onFind;
    this.el.title.classList.add('on');
    this.el.root.classList.add('title-on');
  }

  hideTitle() {
    this.el.title.classList.remove('on');
    this.el.root.classList.remove('title-on');
  }

  titleNote(text) {
    this.el.note.textContent = text;
    this.el.note.classList.add('on');
    clearTimeout(this.noteTimer);
    this.noteTimer = setTimeout(() => this.el.note.classList.remove('on'), 2600);
  }

  showLobby(model, handlers) {
    this.lobbyHandlers = handlers;
    this.el.name.value = model.name;
    this.el.roomName.value = model.room;
    this.el.name.oninput = () => handlers.onName(this.el.name.value);
    this.el.roomName.oninput = () => handlers.onRoomName(this.el.roomName.value);
    this.el.maps.innerHTML = '';
    for (const m of model.maps) {
      const b = document.createElement('button');
      b.innerHTML = `${m.zh}<small>${m.label}</small>`;
      b.onclick = () => handlers.onMap(m.id);
      this.el.maps.appendChild(b);
    }
    this.el.btnStart.onclick = handlers.onStart;
    this.el.btnBack.onclick = handlers.onBack;
    this.el.lobby.classList.add('on');
    this.el.root.classList.add('lobby-on');
    this.renderLobby(model);
  }

  hideLobby() {
    this.el.lobby.classList.remove('on');
    this.el.root.classList.remove('lobby-on');
  }

  renderLobby(model) {
    const count = (t) => model.roster[t].filter(Boolean).length;
    const warn = count('ct') === 0 || count('t') === 0;
    this.el.warn.textContent = warn
      ? `⚠ ${count('ct') === 0 ? '反恐部隊' : '恐怖分子'}沒有任何人，開始後不會有對手`
      : '';
    this.el.warn.classList.toggle('on', warn);
    this.el.netdot.textContent = `${model.online ? '● 已連線' : '● 離線模式（只能單機）'} · build ${BUILD}`;
    this.el.netdot.className = `netdot ${model.online ? 'on' : 'off'}`;
    [...this.el.maps.children].forEach((b, i) => {
      b.classList.toggle('sel', model.maps[i].id === model.map);
    });
    for (const team of ['ct', 't']) {
      const host = this.el.slots[team];
      host.innerHTML = '';
      model.roster[team].forEach((slot, i) => {
        const kind = slot ? slot.type : 'free';
        const mine = kind === 'human' && model.isMine(slot);
        const row = document.createElement('div');
        row.className = `slot ${kind === 'free' ? 'free' : ''} ${mine ? 'me' : ''}`;
        const who = kind === 'human' ? (slot.name || '玩家') : kind === 'bot' ? slot.name : '空位';
        const tag = mine ? '你' : kind === 'human' ? '玩家' : kind === 'bot' ? '電腦' : '';
        row.innerHTML =
          `<span class="av">${kind === 'free' ? '+' : who.slice(0, 1).toUpperCase()}</span>` +
          `<span class="who">${who}</span><span class="tag">${tag}</span>`;

        const act = (label, action, cls) => {
          const b = document.createElement('button');
          b.className = `act ${cls}`;
          b.textContent = label;
          b.onclick = () => this.lobbyHandlers.onSlot(team, i, action);
          row.appendChild(b);
        };
        if (kind === 'free') {
          act('換到這裡', 'join', 'join');
          act('＋ 電腦', 'bot', 'add');
        } else if (kind === 'bot') {
          act('移除', 'remove', 'del');
        }
        host.appendChild(row);
      });
    }
  }

  showBrowse(handlers) {
    this.el.btnRefresh.onclick = handlers.onRefresh;
    this.el.btnBBack.onclick = handlers.onBack;
    this.browseHandlers = handlers;
    this.el.browse.classList.add('on');
    this.el.root.classList.add('lobby-on');
  }

  hideBrowse() {
    this.el.browse.classList.remove('on');
    this.el.root.classList.remove('lobby-on');
  }

  setNetStatus(label) {
    this.netLabel = label;
  }

  renderRooms(rooms) {
    const host = this.el.rooms;
    host.innerHTML = '';
    this.el.browseSub.textContent = this.netLabel || `房間列表 · ${rooms.length} 間`;
    if (!rooms.length) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = '目前沒有房間 · 回上一頁用「新建遊戲」開一間';
      host.appendChild(d);
      return;
    }
    for (const r of rooms) {
      const row = document.createElement('div');
      row.className = 'row';
      const open = r.status === 'open';
      row.innerHTML =
        `<span class="rname">${r.name}</span>` +
        `<span class="dim">${r.host}</span>` +
        `<span class="dim">${r.mapLabel || r.map || ''}</span>` +
        `<span class="dim">${r.filled} / ${r.max}</span>` +
        `<span class="st ${open ? 'open' : 'playing'}">${open ? '等待中' : '進行中'}</span>`;
      const b = document.createElement('button');
      b.textContent = open ? '加入' : '遊戲中';
      b.disabled = !open;
      if (open) b.onclick = () => this.browseHandlers.onJoin(r);
      row.appendChild(b);
      host.appendChild(row);
    }
  }

  // 名牌：由 renderer 算好螢幕座標後餵進來
  toggleDebug() {
    this.el.debug.classList.toggle('on');
    return this.el.debug.classList.contains('on');
  }

  setDebug(text) {
    if (this.el.debug.classList.contains('on')) this.el.debug.textContent = text;
  }

  setPlates(list) {
    const host = this.el.plates;
    while (host.childElementCount < list.length) host.appendChild(document.createElement('div'));
    while (host.childElementCount > list.length) host.lastChild.remove();
    list.forEach((p, i) => {
      const el = host.children[i];
      el.textContent = p.name;
      el.style.left = `${p.x}px`;
      el.style.top = `${p.y}px`;
      el.style.color = p.color;
      el.style.opacity = p.opacity;
    });
  }

  overlay(title, sub, button, onClick) {
    this.el.ovt.textContent = title;
    this.el.ovs.innerHTML = sub;
    this.el.ovb.textContent = button;
    this.el.ovb.onclick = onClick;
    this.el.ov.classList.add('on');
  }

  hideOverlay() {
    this.el.ov.classList.remove('on');
  }
}


const AIM_DOT = Math.cos(0.07);

class GLRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.r = new Renderer(canvas);
    this.tex = loadTextures(this.r.gl);
    this.setMapVisual();
  }

  setMapVisual() {
    const sun = vnorm(currentMap().env.sun);
    const lightView = lookAt(vmul(sun, 90), [0, 0, 0], [0, 1, 0]);
    this.r.setLight(mat4Mul(ortho(34, 34, 1, 190), lightView));
  }

  async init() {}

  drawScene(v, depthOnly) {
    if (depthOnly) drawMapDepth(this.r);
    else drawMap(this.r, this.tex);
    for (const e of v.enemies) {
      if (!e.alive && e.dying >= 0.55) continue;
      e.draw(this.r, depthOnly);
    }
  }

  drawEffects(v) {
    const r = this.r;
    r.texture(null);
    for (const d of v.decals) {
      const n = d.n;
      const ref = Math.abs(n[1]) > 0.9 ? [1, 0, 0] : [0, 1, 0];
      const x = vnorm(vcross(ref, n));
      const y = vcross(n, x);
      const fade = Math.min(1, d.life / 3);
      const g = 1 - fade;
      r.basis(x, y, n, d.p, [0.11, 0.11, 0.008], [0.1 * fade + 0.5 * g, 0.09 * fade + 0.45 * g, 0.08 * fade + 0.4 * g]);
    }
    for (const p of v.particles) r.cube(p.p, [p.size, p.size, p.size], p.c, 0.5);
    for (const t of v.tracers) r.segment(t.a, t.b, 0.018, t.c);
  }

  // 名牌：手動把世界座標乘上 proj*view 投影到螢幕
  updatePlates(v, proj, view, eye) {
    if (!v.plates) return;
    if (v.title || !v.playing) {
      v.plates([]);
      return;
    }
    const w = this.canvas.clientWidth;
    const h = this.canvas.clientHeight;
    const fwd = v.player.dir;
    const list = [];
    for (const b of v.enemies) {
      if (!b.alive || !b.name) continue;
      const wp = [b.pos[0], b.pos[1] + 2.1, b.pos[2]];
      const dx = wp[0] - eye[0];
      const dy = wp[1] - eye[1];
      const dz = wp[2] - eye[2];
      const dist = Math.hypot(dx, dy, dz);
      if (dist > 42) continue;
      const ally = b.team === v.player.team;
      if (!ally && (dx * fwd[0] + dy * fwd[1] + dz * fwd[2]) / dist < AIM_DOT) continue;

      const e = [0, 0, 0, 0];
      for (let i = 0; i < 4; i++) {
        e[i] = view[i] * wp[0] + view[4 + i] * wp[1] + view[8 + i] * wp[2] + view[12 + i];
      }
      const c = [0, 0, 0, 0];
      for (let i = 0; i < 4; i++) {
        c[i] = proj[i] * e[0] + proj[4 + i] * e[1] + proj[8 + i] * e[2] + proj[12 + i] * e[3];
      }
      if (c[3] <= 0) continue;
      list.push({
        name: b.name,
        x: Math.round((c[0] / c[3] * 0.5 + 0.5) * w),
        y: Math.round((-c[1] / c[3] * 0.5 + 0.5) * h),
        color: ally ? '#8fe39a' : '#ff8a76',
        opacity: (1 - Math.max(0, Math.min(1, (dist - 24) / 16)) * 0.75).toFixed(2),
      });
    }
    v.plates(list);
  }

  render(v) {
    const r = this.r;
    const player = v.player;
    r.resize();
    let eye;
    let fwd;
    if (v.title) {
      const t = v.clock * 0.042;
      eye = [Math.cos(t) * 20.5, 6.4 + Math.sin(t * 0.62) * 1.1, Math.sin(t) * 20.5];
      fwd = vnorm([-eye[0], 1.2 - eye[1], -eye[2]]);
    } else {
      eye = v.playing ? player.viewEye : player.eye;
      fwd = player.dir;
    }
    const aspect = this.canvas.width / this.canvas.height;

    r.shadowPass(() => this.drawScene(v, true));

    const right = vnorm(vcross(fwd, [0, 1, 0]));
    const up = v.title ? [0, 1, 0] : vnorm(vadd(vcross(right, fwd), vmul(right, Math.sin(player.roll))));
    const spec = player.spec;
    const zoom = player.scoped && spec.scopeFov ? spec.scopeFov : 1;
    const proj = perspective(v.title ? 0.77 : (Math.PI / 2.35) * zoom, aspect, 0.05, 260);
    const view = lookAt(eye, vadd(eye, fwd), up);

    this.updatePlates(v, proj, view, eye);
    const env = currentMap().env;
    r.mainPass(proj, view, eye, env);
    r.set('uTime', v.clock);

    r.set('uShadowOn', 0);
    r.texture(null);
    r.sky(eye);
    r.set('uShadowOn', 1);

    this.drawScene(v, false);
    r.set('uShadowOn', 0);
    this.drawEffects(v);

    if (player.scoped || v.title) return;

    r.clearDepth();
    r.setProjView(perspective(1.05, aspect, 0.01, 12), IDENTITY);
    r.set('uCam', [0, 0, 0]);
    r.set('uSun', vnorm([-0.35, 0.7, 0.62]));
    r.set('uFogNear', 900);
    r.set('uFogFar', 1000);
    r.texture(null);
    player.drawViewmodel(r, v.muzzle > 0 ? 1 : 0);
  }
}


const ROUND_TIME = 120;
const ENEMY_DAMAGE = 9;

function createGame(canvas, renderer) {
  const ui = new UI();
  const player = new Player();

  let roster = emptyRoster();
  let playerName = 'PLAYER';
  let roomName = '';
  let mapId = 'dust';
  // 標題畫面用滿編陣容當背景
  let bots = createBots({
    ct: [{ type: 'bot', name: 'Volt' }, { type: 'bot', name: 'Piper' }, null],
    t: [{ type: 'bot', name: 'Mako' }, { type: 'bot', name: 'Cinder' }, null],
  }, null);
  let tracers = [];
  let particles = [];
  let decals = [];
  let score = { ct: 0, t: 0 };
  let timeLeft = ROUND_TIME;
  let state = 'title';
  let clock = 0;
  let muzzle = 0;

  const keys = {};
  const mouse = { down: false, pressed: false };

  addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (state !== 'play') return;
    if (e.code === 'Space') e.preventDefault();
    if (e.code === 'F3') { e.preventDefault(); debugOn = ui.toggleDebug(); }
    if (e.code === 'KeyR') player.reload();
    if (e.code === 'Digit1') player.switchTo('pistol');
    if (e.code === 'Digit2') player.switchTo('rifle');
    if (e.code === 'Digit3') player.switchTo('sniper');
    if (e.code === 'Digit4') player.switchTo('shotgun');
  });
  addEventListener('keyup', (e) => { keys[e.code] = false; });
  addEventListener('mousedown', (e) => {
    if (e.button === 2) {
      // 右鍵切換開鏡（不是按住）。開火會自動退鏡，再按一次右鍵就能重新開鏡。
      if (state === 'play') player.setScope(!player.scoped);
      return;
    }
    if (e.button !== 0) return;
    mouse.down = true;
    mouse.pressed = true;
  });
  addEventListener('mouseup', (e) => {
    if (e.button === 0) mouse.down = false;
  });
  addEventListener('contextmenu', (e) => {
    if (state === 'play') e.preventDefault();
  });
  addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === canvas) player.look(e.movementX, e.movementY);
  });
  document.addEventListener('pointerlockchange', () => {
    if (document.pointerLockElement !== canvas && state === 'play') pause();
  });

  // 標題畫面把士兵擺到固定位置當背景構圖（按新建遊戲會重新隨機生成）
  const TITLE_POSE = [
    [3.2, 6.0, -2.5], [-3.6, 7.2, 2.4], [6.4, -2.2, 3.4], [-7.0, -3.4, 1.2], [1.0, 12.5, 3.0],
  ];

  const myCid = () => net.cid || 'local';
  const isMine = (slot) => !!slot && slot.type === 'human' && slot.cid === myCid();
  const mapList = () => Object.values(MAPS).map((m) => ({ id: m.id, zh: m.zh, label: m.label }));

  function lobbyModel() {
    return {
      roster, name: playerName, room: roomName, map: mapId,
      maps: mapList(), isMine,
      online: net.online,
      canStart: !net.online || !net.room || net.room.hostId === myCid(),
    };
  }

  function refreshLobby() {
    if (state === 'lobby') ui.renderLobby(lobbyModel());
  }

  // 線上時所有動作都送給伺服器，畫面等廣播回來再更新；離線時直接改本機狀態。
  const lobbyHandlers = {
    onName: (v) => {
      playerName = v.slice(0, 12);
      net.setName(playerName);
      if (!net.online) {
        const seat = findSeat(roster, myCid());
        if (seat) roster[seat.team][seat.index].name = playerName;
        refreshLobby();
      }
    },
    onRoomName: (v) => {
      roomName = v.slice(0, 18);
      if (net.online) net.send({ t: 'roomname', name: roomName });
    },
    onMap: (id) => {
      mapId = id;
      if (net.online) net.send({ t: 'map', mapId: id });
      else refreshLobby();
    },
    onSlot: (team, i, action) => {
      if (net.online) {
        net.send({ t: 'slot', team, index: i, action, botName: pickBotName(roster) });
        return;
      }
      if (action === 'join') movePlayer(roster, team, i, myCid(), playerName);
      else toggleBot(roster, team, i);
      refreshLobby();
    },
    onStart: () => {
      if (net.online) net.send({ t: 'start' });
      else { ui.hideLobby(); startMatch(); }
    },
    onBack: () => {
      if (net.online) net.send({ t: 'leave' });
      ui.hideLobby();
      title();
    },
  };

  function lobby() {
    state = 'lobby';
    ui.hideTitle();
    if (!roomName) roomName = `${playerName || '玩家'} 的房間`;
    if (net.online) {
      net.send({ t: 'create', name: roomName, mapId });
    } else {
      roster = emptyRoster(myCid(), playerName);
    }
    ui.showLobby(lobbyModel(), lobbyHandlers);
  }

  function browse() {
    state = 'browse';
    ui.hideTitle();
    ui.setNetStatus(net.online ? '線上房間' : '離線模式 · 只看得到本機房間');
    ui.showBrowse({
      onRefresh: () => net.listRooms(),
      onBack: () => { ui.hideBrowse(); title(); },
      onJoin: (room) => {
        if (net.online && !room.local) { net.send({ t: 'join', id: room.id }); return; }
        roster = room.roster || emptyRoster(myCid(), playerName);
        roomName = room.name;
        mapId = room.mapId || 'dust';
        ui.hideBrowse();
        startMatch();
      },
    });
    net.listRooms();
  }

  function startMatch() {
    setMap(mapId);
    buildNav();
    if (renderer.setMapVisual) renderer.setMapVisual();
    const seat = findSeat(roster, myCid());
    player.team = seat ? seat.team : 'ct';
    player.name = playerName || '玩家';
    bots = createBots(roster, player.pos);
    syncRoster(roster);
    if (renderer.onEnemiesReset) renderer.onEnemiesReset(combatants());
    ui.setTeam(player.team);
    restart();
  }

  function title() {
    state = 'title';
    bots.forEach((e, i) => {
      const p = TITLE_POSE[i % TITLE_POSE.length];
      e.pos[0] = p[0];
      e.pos[1] = 0;
      e.pos[2] = p[1];
      e.yaw = p[2];
      e.moving = 0;
      e.alive = true;
      e.hp = 100;
    });
    ui.showTitle({
      onNew: lobby,
      onFind: browse,
    });
  }

  function menu() {
    state = 'menu';
    ui.overlay(
      'DEATHMATCH',
      'WASD 移動 · 空白鍵跳躍 · Ctrl 蹲下<br>左鍵射擊 · 右鍵開鏡 · R 換彈<br>1 手槍 · 2 步槍 · 3 狙擊 · 4 散彈<br>爆頭四倍傷害 · 120 秒內擊倒最多敵人',
      'CLICK TO PLAY',
      resume
    );
  }

  function pause() {
    state = 'paused';
    ui.overlay('PAUSED', `CT ${score.ct} — T ${score.t}`, 'RESUME', resume);
  }

  function resume() {
    ui.hideOverlay();
    mouse.down = false;
    mouse.pressed = false;
    player.setScope(false);
    state = 'play';
    canvas.requestPointerLock();
  }

  function restart() {
    const team = player.team || 'ct';
    const name = player.name || playerName;
    player.reset();
    player.team = team;
    player.name = name;
    for (const b of bots) b.spawn(player.pos);
    tracers = [];
    particles = [];
    decals = [];
    score = { ct: 0, t: 0 };
    timeLeft = ROUND_TIME;
    ui.clearFeed();
    ui.setScore(0, 0);
    resume();
  }

  function finish(title, sub) {
    state = 'over';
    if (net.online && isHost()) net.send({ t: 'ended' });
    if (document.pointerLockElement === canvas) document.exitPointerLock();
    ui.overlay(title, sub, 'PLAY AGAIN', restart);
  }

  function burst(p, n, color, speed, spread) {
    for (let i = 0; i < n; i++) {
      particles.push({
        p: [p[0], p[1], p[2]],
        v: [(Math.random() - 0.5) * spread, Math.random() * speed * 0.9, (Math.random() - 0.5) * spread],
        life: 0.35 + Math.random() * 0.4,
        max: 0.75,
        size: 0.02 + Math.random() * 0.04,
        c: color,
      });
    }
  }

  function addDecal(p, n) {
    decals.push({ p: vadd(p, vmul(n, 0.012)), n, life: 12 });
    if (decals.length > 44) decals.shift();
  }

  // 線上時記分交給伺服器，避免各機器算出不同比分；離線時自己記。
  function reportKill(killer, victim, head) {
    const team = killer ? killer.team : null;
    const kname = (killer && killer.name) || '?';
    const vname = (victim && victim.name) || '?';
    if (net.online) {
      net.send({ t: 'kill', team, killer: kname, victim: vname, head: !!head });
      return;
    }
    if (team) {
      score[team] += 1;
      ui.setScore(score.ct, score.t);
    }
    ui.killfeed(kname, vname, head ? '☠ HS' : '✖');
  }

  function botShoot(shooter, target, dir, dist) {
    const acc = dist < 12 ? 0.68 : dist < 24 ? 0.46 : 0.26;
    const hit = Math.random() < acc;
    const from = shooter.muzzle();
    const end = hit ? target.eye : vadd(from, vmul(dir, Math.min(dist, rayWalls(from, dir, dist))));
    tracers.push({ a: from, b: end, life: 0.05, max: 0.05, c: [1, 0.85, 0.45] });
    if (!hit) return;

    if (target === player) {
      ui.flashDamage();
      if (player.damage(ENEMY_DAMAGE) === 0) {
        reportKill(shooter, player);
        const foe = TEAMS[shooter.team].zh;
        finish('YOU DIED', `被${foe}擊倒。<br>CT ${score.ct} — T ${score.t}`);
      }
      return;
    }
    if (target.remote) {
      // 傷害由被打的那個人套用，這裡只通知
      net.send({ t: 'hit', kind: 'player', cid: target.cid, dmg: ENEMY_DAMAGE });
      return;
    }
    if (target.hit(ENEMY_DAMAGE)) reportKill(shooter, target);
  }

  // dirs 是這一次擊發的所有彈道（散彈槍一次多顆）。
  // 傷害先依敵人累加再一次結算，才不會一槍打出九筆擊殺訊息。
  function playerShoot(dirs) {
    const origin = player.eye;
    const spec = player.spec;
    const hits = new Map();
    const targets = combatants();
    muzzle = 0.05;

    for (const dir of dirs) {
      const wall = rayWallsHit(origin, dir, 200);
      let target = null;
      let head = false;
      let best = wall.t;

      for (const e of targets) {
        if (!e.alive || e.team === player.team) continue;
        const hb = e.headBounds();
        const th = rayBox(origin, dir, hb[0], hb[1]);
        if (th < best) {
          best = th;
          target = e;
          head = true;
          continue;
        }
        const [mn, mx] = e.bounds();
        const t = rayBox(origin, dir, mn, mx);
        if (t < best) {
          best = t;
          target = e;
          head = false;
        }
      }

      const from = vadd(origin, vmul(dir, 0.6));
      const end = vadd(origin, vmul(dir, Math.min(best, 200)));
      tracers.push({ a: from, b: end, life: 0.035, max: 0.035, c: [1, 0.96, 0.72] });
      if (net.online) net.send({ t: 'f', o: from.map((v) => +v.toFixed(2)), e: end.map((v) => +v.toFixed(2)) });

      if (!target) {
        if (wall.n) {
          addDecal(end, wall.n);
          burst(end, dirs.length > 1 ? 3 : 7, [0.72, 0.66, 0.52], 1.6, 2.2);
        }
        continue;
      }

      burst(end, head ? 12 : 8, [0.62, 0.06, 0.06], 1.4, 1.9);
      const acc = hits.get(target) || { dmg: 0, head: false };
      acc.dmg += spec.damage * (head ? HEAD_MULT : 1);
      acc.head = acc.head || head;
      hits.set(target, acc);
    }

    if (!hits.size) return;
    let killed = false;
    let killHead = false;
    for (const [enemy, acc] of hits) {
      if (enemy.remote) {
        // 傷害由被打的那個人套用，這裡只通知
        net.send({ t: 'hit', kind: 'player', cid: enemy.cid, dmg: acc.dmg });
        continue;
      }
      if (net.online && !isHost()) {
        // 電腦的血量由房主保管，傷害轉給房主套用
        net.send({ t: 'hit', kind: 'bot', bot: bots.indexOf(enemy), dmg: acc.dmg });
        continue;
      }
      if (!enemy.hit(acc.dmg)) continue;
      killed = true;
      killHead = killHead || acc.head;
      reportKill(player, enemy, acc.head);
    }
    ui.hitmarker(true);
    if (killed && killHead) ui.message('HEADSHOT', 900);
  }

  function update(dt) {
    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      const verdict = score.ct > score.t ? 'CT WIN' : score.ct === score.t ? 'DRAW' : 'T WIN';
      finish('ROUND OVER', `${verdict}<br>CT ${score.ct} — T ${score.t}`);
      return;
    }

    // 先讓上一幀的特效老化，再產生這一幀的新特效。
    // 這樣即使 dt 大於特效壽命（低張數時），新特效也保證至少被畫到一次。
    muzzle = Math.max(0, muzzle - dt);
    for (const p of particles) {
      p.life -= dt;
      p.v[1] -= 9.5 * dt;
      p.p[0] += p.v[0] * dt;
      p.p[1] += p.v[1] * dt;
      p.p[2] += p.v[2] * dt;
      if (p.p[1] < 0.01) {
        p.p[1] = 0.01;
        p.v[1] *= -0.25;
        p.v[0] *= 0.6;
        p.v[2] *= 0.6;
      }
    }
    particles = particles.filter((p) => p.life > 0);
    tracers = tracers.filter((t) => (t.life -= dt) > 0);
    for (const d of decals) d.life -= dt;
    decals = decals.filter((d) => d.life > 0);

    player.update(dt, keys);
    const shots = player.tryShoot(mouse.down, mouse.pressed);
    mouse.pressed = false;
    if (shots) playerShoot(shots);

    // 電腦只由房主模擬，其他人套用房主廣播的位置，畫面才會一致
    if (isHost()) {
      const world = { player, bots: combatants() };
      for (const b of bots) b.update(dt, world, botShoot);
    }
    for (const r of remotes.values()) r.update(dt, clock);
    pushNetState(dt);

    if (debugOn) {
      const seat = (t) => roster[t].map((x) => {
        if (!x) return '[空]';
        if (x.type === 'bot') return `[電腦:${x.name}]`;
        return `[${x.cid === myCid() ? '★我' : x.cid}:${x.name}]`;
      }).join('');
      const lines = [
        `build ${BUILD}  ${net.online ? '線上' : '離線'}  ` +
          `${isHost() ? '房主' : '非房主'}  我=${myCid()}  房主=${net.room ? net.room.hostId : '-'}`,
        `我隊 ${player.team}  電腦 ${bots.length}  遠端 ${remotes.size}`,
        `席位 ct${seat('ct')}`,
        `席位 t ${seat('t')}`,
      ];
      for (const r of remotes.values()) {
        const last = r.buf.length ? (clock - r.buf[r.buf.length - 1].t).toFixed(1) : '從未';
        lines.push(
          `遠端 ${r.cid}:${r.name}(${r.team}) 位置${r.pos.map((v) => v.toFixed(0)).join(',')} ` +
          `上次更新${last}s 封包${r.buf.length}`
        );
      }
      for (const b of bots) {
        const d = Math.hypot(b.pos[0] - player.pos[0], b.pos[2] - player.pos[2]);
        lines.push(
          `電腦 ${b.name}(${b.team}) 距${d.toFixed(1)}m 血${Math.max(0, b.hp)} ` +
          `${b.alive ? '活' : '死'} moving${b.moving.toFixed(1)} ` +
          `${b.target ? '有目標' : '無目標'} 卡${b.stuck.toFixed(1)}`
        );
      }
      ui.setDebug(lines.join('\n'));
    }

    const s = player.spec;
    ui.setWeapon(s.label, player.ammo[player.weapon], s.mag, player.reloading > 0);
    ui.setHP(player.hp);
    ui.setTime(timeLeft);
    ui.setSpread(Math.min(1, player.bobAmount * 0.35 + Math.abs(player.recoil) * 7));
    ui.setScoped(player.scoped);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    clock += dt;
    if (state === 'play') update(dt);
    renderer.render({
      player, enemies: combatants(), tracers, particles, decals, clock, muzzle,
      playing: state === 'play', title: state !== 'play' && state !== 'paused' && state !== 'over',
      plates: emitPlates,
    });
    requestAnimationFrame(frame);
  }

  Remote.drawFn = Enemy.prototype.draw;

  /** @type {Map<string, Remote>} 其他真人玩家 */
  const remotes = new Map();
  let netTimer = 0;
  let debugOn = false;
  const isHost = () => !net.online || !net.room || net.room.hostId === net.cid;

  function combatants() {
    return bots.concat([...remotes.values()]);
  }

  function remoteByCid(cid) {
    return remotes.get(cid);
  }

  function syncRoster(roster) {
    const seen = new Set();
    for (const team of ['ct', 't']) {
      for (const slot of roster[team]) {
        if (!slot || slot.type !== 'human' || slot.cid === myCid()) continue;
        seen.add(slot.cid);
        let r = remotes.get(slot.cid);
        if (!r) { r = new Remote(slot.cid, slot.name, team); remotes.set(slot.cid, r); }
        r.team = team;
        r.name = slot.name;
      }
    }
    for (const cid of [...remotes.keys()]) if (!seen.has(cid)) remotes.delete(cid);
  }

  // 每 1/20 秒把自己的狀態送出去；房主另外送電腦的狀態，
  // 否則每個人畫面上的電腦會各走各的。
  function pushNetState(dt) {
    if (!net.online || state !== 'play') return;
    netTimer -= dt;
    if (netTimer > 0) return;
    netTimer = REMOTE_RATE;
    net.send({
      t: 's',
      s: {
        p: [+player.pos[0].toFixed(2), +player.pos[1].toFixed(2), +player.pos[2].toFixed(2)],
        y: +player.yaw.toFixed(3),
        m: player.bobAmount > 0.4 ? 1 : 0,
        a: player.alive,
        hp: player.hp,
        n: player.name,
      },
    });
    if (isHost() && bots.length) {
      net.send({
        t: 'b',
        bots: bots.map((b, i) => ({
          i,
          p: [+b.pos[0].toFixed(2), +b.pos[1].toFixed(2), +b.pos[2].toFixed(2)],
          y: +b.yaw.toFixed(3),
          m: b.moving > 0.5 ? 1 : 0,
          a: b.alive,
          hp: b.hp,
        })),
      });
    }
  }

  const emitPlates = (list) => ui.setPlates(list);

  const net = new Net({
    onStatus: () => {
      if (state === 'browse') ui.setNetStatus(net.online ? '線上房間' : '離線模式 · 只看得到本機房間');
      refreshLobby();
    },
    onRooms: (list) => {
      if (state !== 'browse') return;
      const labels = Object.fromEntries(Object.values(MAPS).map((m) => [m.id, m.label]));
      ui.renderRooms(list.map((r) => ({ ...r, mapLabel: labels[r.mapId] || r.mapId })));
    },
    onRoom: (room) => {
      roster = room.roster;
      roomName = room.name;
      mapId = room.mapId;
      if (state === 'browse') { ui.hideBrowse(); state = 'lobby'; ui.showLobby(lobbyModel(), lobbyHandlers); }
      else refreshLobby();
    },
    onStart: (room) => {
      roster = room.roster;
      mapId = room.mapId;
      ui.hideLobby();
      startMatch();
    },
    onLeft: () => {},
    onError: (msg) => ui.titleNote(msg),
    onState: (cid, st) => {
      const r = remotes.get(cid);
      if (r) r.push(st, clock);
    },
    onBots: (list) => {
      if (isHost()) return;
      for (const b of list) {
        const bot = bots[b.i];
        if (!bot) continue;
        const moved = Math.hypot(b.p[0] - bot.pos[0], b.p[2] - bot.pos[2]);
        bot.phase += moved * 5.2;
        bot.pos[0] = b.p[0];
        bot.pos[1] = b.p[1];
        bot.pos[2] = b.p[2];
        bot.yaw = b.y;
        bot.moving = b.m;
        bot.alive = b.a;
        bot.hp = b.hp;
        if (!b.a) bot.dying = Math.min(0.55, bot.dying + 0.05);
        else bot.dying = 0;
      }
    },
    onFire: (cid, o, e) => {
      tracers.push({ a: o, b: e, life: 0.05, max: 0.05, c: [1, 0.85, 0.45] });
      const r = remotes.get(cid);
      if (r) r.flash = 0.06;
    },
    onHit: (m) => {
      if (m.bot !== undefined) {
        const bot = bots[m.bot];
        if (!bot || !bot.alive) return;
        if (bot.hit(m.dmg)) reportKill(remoteByCid(m.from), bot);
        return;
      }
      ui.flashDamage();
      if (player.damage(m.dmg) === 0) {
        const killer = remoteByCid(m.from);
        reportKill(killer, player);
        finish('YOU DIED', `被 ${killer ? killer.name : '對手'} 擊倒。<br>CT ${score.ct} — T ${score.t}`);
      }
    },
    onKill: (m) => {
      score = m.score;
      ui.setScore(score.ct, score.t);
      ui.killfeed(m.killer, m.victim, m.head ? '☠ HS' : '✖');
    },
  });
  net.setName(playerName);
  net.connect();
  player.team = 'ct';
  player.name = playerName;
  ui.setTeam('ct');
  ui.setScore(0, 0);
  ui.setHP(100);
  ui.setTime(ROUND_TIME);
  ui.setWeapon(WEAPONS.rifle.label, WEAPONS.rifle.mag, WEAPONS.rifle.mag, false);
  if (renderer.onEnemiesReset) renderer.onEnemiesReset(bots);
  title();
  requestAnimationFrame(frame);

  return { ui, player };
}


const canvas = document.getElementById('game');
const renderer = new GLRenderer(canvas);
createGame(canvas, renderer);

})();
</script>
